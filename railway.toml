[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader --no-scripts"

[deploy]
startCommand = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
healthCheckPath = "/"
restartPolicyCondition = "on-failure"
