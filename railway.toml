[build]
builder = "nixpacks"
buildCommand = "composer install --no-dev --optimize-autoloader && chmod -R 777 storage bootstrap/cache && php artisan config:cache && php artisan route:cache && php artisan view:cache"

[deploy]
startCommand = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
restartPolicyCondition = "on-failure"
